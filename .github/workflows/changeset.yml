name: Changesets

on: pull_request

permissions:
  contents: read

jobs:
  changeset:
    name: Require changeset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Require a new changeset recognized by the CLI
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          npm run changeset -- status --output="$RUNNER_TEMP/changesets.json"
          while IFS= read -r -d '' path; do
            id=${path#.changeset/}
            if jq -e --arg id "${id%.md}" 'any(.changesets[]; .id == $id)' "$RUNNER_TEMP/changesets.json" > /dev/null; then
              exit 0
            fi
          done < <(git diff --name-only -z --diff-filter=A "$BASE_SHA" HEAD -- '.changeset/*.md')
          echo "::error::Add a changeset with npm run changeset (or npm run changeset -- --empty) and commit it."
          exit 1
