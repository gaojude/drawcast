name: Verify

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Render a CLI snapshot
        run: node dist/cli.js snapshot examples/cache.drawcast.json --step 1 --width 640 -o smoke.png
      - name: Verify the PNG and its dimensions
        run: >-
          node -e "const png = require('node:fs').readFileSync('smoke.png');
          require('node:assert/strict').deepEqual(
          [png.subarray(0, 8).toString('hex'), png.readUInt32BE(16), png.readUInt32BE(20)],
          ['89504e470d0a1a0a', 640, 360]);"
      - run: npm test

  publish:
    name: Publish to npm
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - name: Check whether this version is unpublished
        id: release
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Skipping: $version is not a stable version."
            exit 0
          fi
          if npm view "drawcast@$version" version > /dev/null 2>&1; then
            echo "Skipping: drawcast@$version is already on npm."
            exit 0
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - if: steps.release.outputs.version
        run: npm ci
      - name: Build the release tarball
        if: steps.release.outputs.version
        run: npm pack --pack-destination "$RUNNER_TEMP"
      - name: Publish the release tarball
        if: steps.release.outputs.version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if [[ -z "$NODE_AUTH_TOKEN" ]]; then
            echo "::error::Add the NPM_TOKEN repository secret as described in CONTRIBUTING.md."
            exit 1
          fi
          npm publish "$RUNNER_TEMP/drawcast-$VERSION.tgz" --access public --tag latest --ignore-scripts
      - name: Tag the release
        if: steps.release.outputs.version
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "Tag v$VERSION already exists."
          else
            git tag "v$VERSION"
            git push origin "v$VERSION"
          fi
